{% extends "base.html" %}

{% block title %}Register & Create ABHA - HealthVault{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
  <div class="max-w-xl w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50">
    
    <!-- Title -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-teal-600 text-white flex items-center justify-center text-xl shadow-md shadow-teal-600/30">
        <i class="fa-solid fa-id-card"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="nav_register">
        Register & Create ABHA Card
      </h2>
      <p class="text-xs text-slate-500">
        Get an official 14-digit ABHA Number, health locker, and access to all digital health features.
      </p>
    </div>

    <!-- Registration Form -->
    <form action="{{ url_for('register') }}" method="POST" class="space-y-4 text-xs">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Full Legal Name *</label>
          <input type="text" name="name" required placeholder="e.g. Ramesh Kumar" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Email Address *</label>
          <input type="email" name="email" required placeholder="name@example.com" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mobile Number (Aadhaar linked)</label>
          <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Password *</label>
          <input type="password" name="password" required placeholder="Create a secure password" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Date of Birth</label>
          <input type="date" name="dob" value="1990-01-01" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Gender</label>
          <select name="gender" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Blood Group</label>
          <select name="blood_group" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
            <option value="O+">O Positive (O+)</option>
            <option value="A+">A Positive (A+)</option>
            <option value="B+">B Positive (B+)</option>
            <option value="AB+">AB Positive (AB+)</option>
            <option value="O-">O Negative (O-)</option>
            <option value="A-">A Negative (A-)</option>
            <option value="B-">B Negative (B-)</option>
            <option value="AB-">AB Negative (AB-)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Emergency Contact (Name & Phone)</label>
        <input type="text" name="emergency_contact" placeholder="e.g. +91 98111 22334 (Spouse / Parent)" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500">
      </div>

      <!-- ABDM Checkbox -->
      <div class="p-3 bg-teal-50/70 border border-teal-200 rounded-xl flex items-start space-x-3">
        <input type="checkbox" id="auto_abha" checked disabled class="mt-0.5 rounded text-teal-600 focus:ring-teal-500">
        <label for="auto_abha" class="text-[11px] text-teal-900 leading-snug">
          <span class="font-bold">Auto-generate 14-Digit ABHA ID & Virtual Address (@abdm)</span>. I authorize HealthVault to issue an ABDM-compliant health identification card for my account.
        </label>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-teal-600/20 transition-all flex items-center justify-center space-x-2">
          <i class="fa-solid fa-shield-check"></i>
          <span>Create Account & Generate ABHA</span>
        </button>
      </div>

    </form>

    <!-- Sign In Link -->
    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-teal-600 font-bold hover:underline" data-i18n="nav_login">
        Sign In here
      </a>
    </div>

  </div>
</div>
{% endblock %}
